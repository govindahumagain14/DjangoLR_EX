<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
</head>
<body>
     {% for message in messages %}
    <div class="alert alert-{{ message.tags}} alert-dismissable fade show" role="alert">
    <strong>Message:</strong> {{ message }}
    <button type="button" class="close" data-dismiss="alert" aria-label="close">
    <span aria-hidden="true">&times;</span>
    </button>
    </div>
    {% endfor %}
    
    <h1>Register Here !</h1>
    <br>
    <form action="" method="post">
    {% csrf_token %}
        <label for="">Username: </label>
        <input type="text" id="username" name="username" placeholder="Create a username" Required>

        <br>
        <label for="">First Name: </label>
        <input type="text" id="fname" name="fname" placeholder="Enter Your First Name" Required>

        <br>
        <label for="">Last Name: </label>
        <input type="text" id="lname" name="lname" placeholder="Enter Your Last Name" Required>

        <br>
        <label for="">Email: </label>
        <input type="email" id="email" name="email" placeholder="Enter Your Email" Required>

        <br>
        <label for="">Password: </label>
        <input type="password" id="pass1" name="pass1" placeholder="Create a Password" Required>

        <br>
        <label for="">Confirm Password: </label>
        <input type="password" id="pass2" name="pass2" placeholder="Confirm Your Password" Required>

        <br>
        <button type="submit">Register</button>
    </form>
</body>
</html>
